# 搜索关键词
keywords:
  - "database audit"
  - "database security"
  - "SQL injection detection"
  - "data leakage detection"
  - "access control database"

# arXiv分类（可选限制）
categories:
  - "cs.CR"  # 安全与隐私
  - "cs.DB"  # 数据库

# 存储路径
paths:
  pdfs: "./data/pdfs"
  markdown: "./data/markdown"
  knowledge: "./data/knowledge"
  logs: "./logs"

# LLM配置（支持多种provider）
llm:
  # Provider选择: claude, openai, ollama, trae, custom
  provider: "trae"
  model: "claude-3-5-sonnet-20241022"

  # API Key（支持环境变量引用）
  # 格式: "${ENV_VAR_NAME}" 或直接填写key
  api_key: "${ANTHROPIC_API_KEY}"

  # 自定义API端点（可选，留空使用默认）
  # 用于代理、私有部署或自定义服务
  base_url: ""

  # Claude配置
  claude:
    model: "claude-3-5-sonnet-20241022"
    api_key: "${ANTHROPIC_API_KEY}"
    base_url: ""  # 可选自定义端点

  # OpenAI配置
  openai:
    model: "gpt-4o"
    api_key: "${OPENAI_API_KEY}"
    base_url: ""  # 可选，如: "https://api.openai.com/v1"

  # Ollama配置（本地模型）
  ollama:
    endpoint: "http://localhost:11434"
    model: "llama3"

  # Trae IDE配置（字节）
  trae:
    enabled: true
    endpoint: "http://localhost:8080"
    model: "default"

  # 自定义Provider配置（通用HTTP API）
  # 适用于任何兼容OpenAI格式的API
  custom:
    enabled: false
    endpoint: "http://localhost:8000/v1"
    model: "custom-model"
    api_key: "${CUSTOM_API_KEY}"
    # 请求格式: openai (默认) 或 custom
    format: "openai"
    # 自定义请求头
    headers: {}
    # 自定义请求体模板
    body_template: null

# 定时任务
schedule:
  time: "08:00"  # 每天8点执行
  enabled: true

# 论文处理配置
paper:
  max_papers_per_day: 10  # 每天最多处理论文数
  skip_if_exists: true    # 如果已存在则跳过
